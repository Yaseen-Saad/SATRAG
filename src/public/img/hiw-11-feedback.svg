<svg viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feedback loop">
  <rect x="20" y="14" width="280" height="152" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="160" y="36" fill="#E2E8F0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" text-anchor="middle">You rate the entry (1-10)</text>
  <rect x="36" y="48" width="248" height="20" rx="4" fill="#1E293B"/>
  <rect x="36" y="48" width="210" height="20" rx="4" fill="#3FCF8E" opacity="0.3"/>
  <text x="160" y="62" fill="#E2E8F0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" text-anchor="middle">8/10 — great mnemonic!</text>
  <path d="M160 72 L160 88" stroke="#3FCF8E" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="160,90 156,84 164,84" fill="#3FCF8E"/>
  <text x="160" y="104" fill="#64748B" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" text-anchor="middle">Feedback is analyzed across all users</text>
  <rect x="36" y="112" width="248" height="44" rx="6" fill="#1E293B" stroke="#3FCF8E" stroke-width="1"/>
  <text x="48" y="130" fill="#6EE7B7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">System learns: "users love vivid picture stories"</text>
  <text x="48" y="146" fill="#7DD3FC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Future entries get better at what you actually like</text>
</svg>
