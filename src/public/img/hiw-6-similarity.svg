<svg viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dot product in vector space">
  <!-- Grid floor (isometric) -->
  <line x1="40" y1="160" x2="280" y2="160" stroke="#334155" stroke-width="0.8"/>
  <line x1="40" y1="160" x2="100" y2="40" stroke="#334155" stroke-width="0.8"/>
  <line x1="40" y1="160" x2="20" y2="130" stroke="#334155" stroke-width="0.8"/>
  <line x1="80" y1="160" x2="130" y2="55" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="120" y1="160" x2="160" y2="70" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="160" y1="160" x2="195" y2="85" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="200" y1="160" x2="225" y2="100" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="240" y1="160" x2="255" y2="115" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="60" y1="140" x2="260" y2="140" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="50" y1="120" x2="245" y2="120" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="45" y1="100" x2="230" y2="100" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="42" y1="80" x2="215" y2="80" stroke="#1E293B" stroke-width="0.5"/>
  <!-- Scattered word dots (dim) -->
  <circle cx="100" cy="95" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="140" cy="110" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="180" cy="80" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="220" cy="105" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="90" cy="130" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="200" cy="130" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="250" cy="90" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="70" cy="115" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="160" cy="125" r="3" fill="#475569" opacity="0.3"/>
  <circle cx="110" cy="70" r="3" fill="#475569" opacity="0.3"/>
  <!-- Your word -->
  <circle cx="160" cy="90" r="10" fill="#38BDF8" opacity="0.12"/>
  <circle cx="160" cy="90" r="6" fill="#38BDF8" opacity="0.25"/>
  <circle cx="160" cy="90" r="3.5" fill="#38BDF8"/>
  <!-- Nearby matches (highlighted, connected by lines) -->
  <circle cx="175" cy="82" r="3.5" fill="#FBBF24"/>
  <circle cx="175" cy="82" r="8" fill="#FBBF24" opacity="0.1"/>
  <line x1="163" y1="88" x2="172" y2="83" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="148" cy="96" r="3.5" fill="#FBBF24"/>
  <circle cx="148" cy="96" r="8" fill="#FBBF24" opacity="0.1"/>
  <line x1="157" y1="92" x2="151" y2="95" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="170" cy="100" r="3.5" fill="#FBBF24"/>
  <circle cx="170" cy="100" r="8" fill="#FBBF24" opacity="0.1"/>
  <line x1="162" y1="93" x2="168" y2="98" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Dot product score -->
  <rect x="190" y="56" width="100" height="26" rx="6" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
  <text x="240" y="73" fill="#FDE68A" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" text-anchor="middle">dot product</text>
  <!-- Labels -->
  <text x="160" y="78" fill="#7DD3FC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" text-anchor="middle">your word</text>
  <text x="185" y="116" fill="#FDE68A" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" text-anchor="middle">nearest neighbors</text>
</svg>
